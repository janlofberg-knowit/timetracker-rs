[tools]
rust = "1.95.0"
# Provides `cargo set-version`, which the `bump` task below drives.
"cargo:cargo-edit" = "latest"

# `mise bump patch` (also minor, major). mise appends the trailing argument to
# the command, so the level reaches `--bump` as-is; cargo rejects anything that
# is not a valid level.
#
# Rewrites `version` in Cargo.toml *and* the crate's own entry in Cargo.lock, so
# the two stay in step without a build. CI reads the version straight out of
# Cargo.toml and tags the release from it — see .github/workflows/build.yml.
#
# Leaves the change uncommitted on purpose: the bump goes to main as its own
# `chore: version bump X.Y.Z` PR, and merging that is what cuts the release.
[tasks.bump]
description = "Bump the crate version in Cargo.toml and Cargo.lock: mise bump <major|minor|patch>"
run = "cargo set-version --bump"

[tasks.fmt]
description = "Rewrite the source in rustfmt's shape"
run = "cargo fmt --all"

# What the pre-commit hook and CI ask: report, change nothing. A formatting
# difference is an error here, so it can gate a commit.
[tasks."fmt:check"]
description = "Fail if anything is unformatted, without rewriting it"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Fail on any clippy warning"
run = "cargo clippy --all-targets -- -D warnings"

# Only the lints clippy can rewrite on its own; the rest it still reports.
# `--allow-dirty --allow-staged` because the point is to run this mid-edit —
# git is the undo here, so check the diff before committing it.
[tasks."lint:fix"]
description = "Apply clippy's machine-applicable suggestions"
run = "cargo clippy --fix --all-targets --allow-dirty --allow-staged"

[tasks.test]
description = "Run the whole test suite"
run = "cargo test --all-targets"

# The check to run before pushing. `depends` runs in parallel, so the slower
# gates are invoked from `run` instead, cheapest first: a formatting-only
# failure then reports on its own rather than scrolling past under a test run.
[tasks.check]
description = "Format check, then clippy, then tests"
depends = ["fmt:check"]
run = ["mise run lint", "mise run test"]

# Points git at the tracked hooks in scripts/githooks rather than copying them
# into .git/hooks, so an updated hook reaches everyone on their next pull and
# `git config --unset core.hooksPath` is the whole uninstall.
[tasks.hooks]
description = "Install the repo's git hooks (format before every commit)"
run = "git config core.hooksPath scripts/githooks"
