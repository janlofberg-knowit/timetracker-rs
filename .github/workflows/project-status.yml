name: Project status

# Moves an issue's card on the TimeTracker project board as work progresses.
#
#   branch `<issue>-*` pushed          ->  In Progress
#   pull request opened                ->  in code review
#   PR merged into a NON-default base  ->  Implemented
#   issue closed                       ->  Done   (the project's built-in "Item closed" workflow)
#
# Why "Implemented" exists. Under ship mode (c) a Task PR merges into a *Story* branch, so its
# `Closes #n` keyword does not fire — closing keywords fire only on merge into the default
# branch. The work is finished but the issue stays open, sometimes for weeks. Without this
# column those cards sit in "in code review" and the board understates what has landed.
#
# Issue resolution. For pull-request events the issue numbers come from the PR's own closing
# keywords (commits + body), NOT from the branch name. A branch is named for one issue but a PR
# often closes several — a bug fixed inside a Task's PR, say — and a branch-name parse silently
# strands the siblings. Verified 2026-08-11: of six Task PRs on one Story branch, two closed an
# issue the branch name never mentioned. The `create` event has no commits yet, so a branch
# parse is the only signal there.
#
# Status option IDs are resolved by NAME at runtime. Hardcoding them means a renamed or
# recreated column silently stops moving cards.

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read

env:
  # Project 1 (janlofberg-knowit/TimeTracker). The project itself is not discoverable from the
  # repo, so this one id stays pinned; everything inside it is resolved by name below.
  PROJECT_ID: PVT_kwHOEfBBA84Bgmie
  STATUS_FIELD_NAME: Status
  IN_PROGRESS_NAME: In Progress
  IN_REVIEW_NAME: in code review
  IMPLEMENTED_NAME: Implemented

jobs:
  move-card:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue numbers and target status
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.event.ref_type }}
          CREATED_REF: ${{ github.event.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_ACTION: ${{ github.event.action }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "create" ]; then
            if [ "$REF_TYPE" != "branch" ]; then
              echo "ref_type is '$REF_TYPE', not a branch — nothing to do."
              exit 0
            fi
            # No commits exist yet, so the branch name is the only signal.
            # Leading digits before the first hyphen are the issue number.
            NUMBER="${CREATED_REF%%-*}"
            case "$NUMBER" in
              '' | *[!0-9]*)
                echo "Branch '$CREATED_REF' is not issue-numbered — skipping."
                exit 0
                ;;
            esac
            ISSUES="$NUMBER"
            TARGET="$IN_PROGRESS_NAME"
          else
            if [ "$PR_ACTION" = "closed" ]; then
              if [ "$PR_MERGED" != "true" ]; then
                echo "PR #$PR_NUMBER closed without merging — nothing to do."
                exit 0
              fi
              if [ "$PR_BASE_REF" = "$DEFAULT_BRANCH" ]; then
                echo "PR #$PR_NUMBER merged into the default branch — closing keywords fire and"
                echo "the project's built-in 'Item closed' workflow sets Done. Nothing to do."
                exit 0
              fi
              TARGET="$IMPLEMENTED_NAME"
            else
              TARGET="$IN_REVIEW_NAME"
            fi

            # Closing keywords from the PR's commits and body. GitHub accepts
            # close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved.
            #
            # Anchored to line start, which is DELIBERATELY stricter than GitHub's own parser.
            # GitHub matches a keyword anywhere, including mid-sentence, so prose like
            # "threading linkPath, which closes #72's handoff" registers as a closing link.
            # Verified on PR #86, whose body contains exactly that. The convention here writes
            # keywords on their own line (convention 9), so anchoring loses nothing real and
            # stops a card moving because an issue got a passing mention.
            KEYWORDS='[Cc]lose[sd]?|[Ff]ix(e[sd])?|[Rr]esolve[sd]?'
            ISSUES="$(
              gh pr view "$PR_NUMBER" --repo "$REPO" \
                --json body,commits \
                --jq '[.body, (.commits[] | .messageHeadline, .messageBody)] | join("\n")' \
                | grep -oE "^ *(${KEYWORDS}) +#[0-9]+" \
                | grep -oE '[0-9]+' \
                | sort -un | tr '\n' ' '
            )" || ISSUES=""

            if [ -z "${ISSUES// /}" ]; then
              # No keyword anywhere — fall back to the branch name so a PR that simply omits
              # one still moves its own card.
              NUMBER="${PR_HEAD_REF%%-*}"
              case "$NUMBER" in
                '' | *[!0-9]*)
                  echo "PR #$PR_NUMBER has no closing keyword and branch '$PR_HEAD_REF' is not"
                  echo "issue-numbered — skipping."
                  exit 0
                  ;;
              esac
              ISSUES="$NUMBER"
              echo "No closing keyword found; falling back to branch name -> #$NUMBER"
            fi
          fi

          echo "Issues:$ISSUES -> $TARGET"
          {
            echo "issues=$ISSUES"
            echo "status=$TARGET"
          } >> "$GITHUB_OUTPUT"

      - name: Add to project and set status
        if: steps.resolve.outputs.issues != ''
        env:
          # A user-level project cannot be written by the default GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUES: ${{ steps.resolve.outputs.issues }}
          STATUS_NAME: ${{ steps.resolve.outputs.status }}
        run: |
          set -euo pipefail

          # Resolve the Status field and the target option BY NAME, so a renamed or recreated
          # column fails loudly here instead of silently never moving a card.
          FIELD_JSON="$(gh api graphql -f query='
            query($project: ID!, $field: String!) {
              node(id: $project) {
                ... on ProjectV2 {
                  field(name: $field) {
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f field="$STATUS_FIELD_NAME" \
            --jq '.data.node.field')"

          FIELD_ID="$(jq -r '.id' <<<"$FIELD_JSON")"
          OPTION_ID="$(jq -r --arg n "$STATUS_NAME" '.options[] | select(.name == $n) | .id' <<<"$FIELD_JSON")"

          if [ -z "$FIELD_ID" ] || [ "$FIELD_ID" = "null" ]; then
            echo "::error::No single-select field named '$STATUS_FIELD_NAME' on the project."
            exit 1
          fi
          if [ -z "$OPTION_ID" ]; then
            echo "::error::No option named '$STATUS_NAME' on the '$STATUS_FIELD_NAME' field."
            echo "Available: $(jq -r '[.options[].name] | join(", ")' <<<"$FIELD_JSON")"
            exit 1
          fi

          for ISSUE in $ISSUES; do
            CONTENT_ID="$(gh api "repos/$REPO/issues/$ISSUE" --jq .node_id)"

            # Idempotent: returns the existing item if the issue is already on the board.
            ITEM_ID="$(gh api graphql -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: { projectId: $project, contentId: $content }) {
                  item { id }
                }
              }' \
              -f project="$PROJECT_ID" \
              -f content="$CONTENT_ID" \
              --jq '.data.addProjectV2ItemById.item.id')"

            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }' \
              -f project="$PROJECT_ID" \
              -f item="$ITEM_ID" \
              -f field="$FIELD_ID" \
              -f option="$OPTION_ID" > /dev/null

            echo "Moved #$ISSUE -> $STATUS_NAME"
          done
